  - cellType: SQL
    cellId: e3dd5db0-ecff-4364-8cef-c4c4f63d0d13 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: New match events
    config:
      source: |
        WITH valid_support_request_id AS (
            SELECT 
                DISTINCT support_request_id
            FROM match.support_requests
            WHERE 
                created_at > '2024-01-25'
                AND status not in  ('waived','duplicated')
                AND support_request_id NOT IN (57972, 57973, 57976, 57971, 57977, 57978, 57980, 57979, 57981, 57982, 57983, 57984, 57985, 57986, 57987, 57988, 57989, 57992, 57991, 57995, 57994, 57996, 57997, 57999, 57998, 58033, 58014)
        ),
        valid_support_request_status_history_with_rn AS (
            SELECT 
                support_request_id,
                status,
                created_at,
                ROW_NUMBER() OVER(PARTITION BY support_request_id ORDER BY created_at) AS rn
            FROM match.support_request_status_history
            INNER JOIN valid_support_request_id USING (support_request_id)
        ),
        support_request_events AS (
            SELECT 
                support_request_id,
                CASE 
                    WHEN rn > 1 AND status IN ('open', 'special_case')  THEN 'waiting_for_match' 
                    ELSE status::VARCHAR 
                END AS status,
                created_at
            FROM valid_support_request_status_history_with_rn
            WHERE status NOT IN ('matched', 'duplicated')
        ),
        valid_matches AS (
            SELECT
                match_id,
                support_request_id,
                match_stage
            FROM match.matches
            INNER JOIN valid_support_request_id USING (support_request_id)
        ),
        match_events AS (
            SELECT
                support_request_id,
                CASE 
                    WHEN status = 'waiting_contact' THEN CONCAT(match_stage, '_match')
                    WHEN status IN ('interrupted_before_support', 'interrupted_after_support') THEN 'interrupted'
                    ELSE status::VARCHAR
                END AS status,
                created_at
            FROM match.match_status_history
            INNER JOIN valid_matches USING (match_id)
        ),
        all_events AS (
            SELECT
                support_request_id,
                status AS event,
                created_at
            FROM support_request_events
            UNION ALL
            SELECT
                support_request_id,
                status AS event,
                created_at
            FROM match_events
        ),
        paths AS (
            SELECT 
                support_request_id,
                event,
                created_at,
                ARRAY_AGG(event) OVER(
                    PARTITION BY support_request_id 
                    ORDER BY created_at 
                    RANGE BETWEEN 
                        UNBOUNDED PRECEDING
                        AND UNBOUNDED FOLLOWING 
                ) AS path
            FROM all_events
        ),
        agg_paths AS (
            SELECT
                path,
                COUNT(DISTINCT support_request_id) AS path_count
            FROM paths
            GROUP BY path
        ),
        valid_paths AS (
            SELECT 
                path
            FROM agg_paths
            WHERE path_count > 1
        ),
        valid_all_events AS (
            SELECT
                support_request_id,
                event,
                created_at
            FROM paths
            INNER JOIN valid_paths USING (path)
        ),
        sources_and_targets AS (
            SELECT 
                *,
                event AS source,
                LEAD(event) OVER (PARTITION BY support_request_id ORDER BY created_at) AS target
            FROM valid_all_events
        ),
        sankey AS (
            SELECT
                source,
                target,
                ARRAY_AGG(support_request_id),
                COUNT(*) AS value
            FROM sources_and_targets
            WHERE 
                target IS NOT NULL
            GROUP BY source, target
        )
        SELECT *
        FROM sankey
        WHERE 
            CONCAT(source, '+', target) NOT IN ('manual_match+manual_match', 'open+waiting_for_match')
            AND value >= 5
        ORDER BY source
      dataFrameCell: false
      dataConnectionId: 683fd824-f935-4980-b99d-a7a513df5030
