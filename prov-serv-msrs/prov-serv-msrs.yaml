  - cellType: BLOCK
    cellId: 019d951d-8ae1-7113-81da-fa766728ac81 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      blockConfig:
        sqlCellId: 019d951d-8d8f-7113-81db-3581420642e7
        chartCellId: 019d951d-8de1-7113-81db-6768a6cacdcd
        activeTab: chart
      cells:
        - cellType: SQL
          cellId: 019d951d-8d8f-7113-81db-3581420642e7
          cellLabel: por ano
          config:
            source: |
              WITH atendimentos_per_year AS (
                  SELECT
                      DATE_TRUNC('year', s.created_at) AS ano,
                      COUNT(DISTINCT s.support_request_id) AS "pedidos de acolhimento por ano",
                      COUNT(DISTINCT CASE WHEN s.status = 'matched' THEN s.support_request_id END) AS "matches por ano",
                      SUM(
                          CASE
                              WHEN
                                  m.status IN (
                                      'in_contact', 'interrupted_after_support', 'completed'
                                  )
                                  THEN 1
                              ELSE 0
                          END
                      ) AS "atendimentos por ano"
                  FROM match.support_requests AS s
                  LEFT JOIN match.matches AS m ON s.support_request_id = m.support_request_id
              WHERE
                  s.status != 'duplicated'
                  AND s.support_type = 'legal'
              GROUP BY 1
              )

              SELECT
              *,
              "atendimentos por ano" / "matches por ano"::NUMERIC(10, 4) AS porcentagem
              FROM atendimentos_per_year
