  - cellType: BLOCK
    cellId: 019d9517-e2bc-7113-81d2-203e7dc5e893 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      blockConfig:
        sqlCellId: 019d9517-e47c-7113-81d2-5acd882d980c
        chartCellId: 019d9517-e4bd-7113-81d2-8e384d560b64
        activeTab: chart
      cells:
        - cellType: SQL
          cellId: 019d9517-e47c-7113-81d2-5acd882d980c
          cellLabel: cumulativo
          config:
            source: |
              WITH atendimentos_per_year AS (
                  SELECT
                      DATE_TRUNC('year', s.created_at) AS ano,
                      COUNT(DISTINCT s.support_request_id) AS "pedidos de acolhimento por ano",
                      COUNT(DISTINCT CASE WHEN s.status = 'matched' THEN s.support_request_id END) AS "matches por ano",
                      SUM(
                          CASE
                              WHEN
                                  m.status IN (
                                      'in_contact', 'interrupted_after_support', 'completed'
                                  )
                                  THEN 1
                              ELSE 0
                          END
                      ) AS "atendimentos por ano"
                  FROM match.support_requests AS s
                  LEFT JOIN match.matches AS m ON s.support_request_id = m.support_request_id
              WHERE
                  s.status != 'duplicated'
                  AND s.support_type = 'psychological'
              GROUP BY 1
              ),

              cumulative_sums AS (
              SELECT
                  *,
                  SUM("atendimentos por ano")
                      OVER (ORDER BY ano)
                  ::INT AS "total de atendimentos",
                  SUM("matches por ano") OVER (ORDER BY ano)::INT AS "total de matches",
                  SUM("pedidos de acolhimento por ano")
                      OVER (ORDER BY ano)
                  ::INT AS "total de pedidos de acolhimento",
                  50000 AS meta
              FROM atendimentos_per_year
              )

              SELECT
              *,
              "total de atendimentos" / "total de matches"::NUMERIC(10, 4) AS porcentagem
              FROM cumulative_sums
            dataFrameCell: false
            dataConnectionId: 683fd824-f935-4980-b99d-a7a513df5030
