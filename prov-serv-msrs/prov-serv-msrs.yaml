  - cellType: BLOCK
    cellId: df4ccb0f-5618-41ec-bcc1-9fdaa04e7671 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      blockConfig:
        sqlCellId: 2357ad9d-93f6-47fb-9f33-ac3b52e794e1
        chartCellId: 38ffd59b-1c46-466d-86d7-3a88873b74f7
        activeTab: chart
      cells:
        - cellType: SQL
          cellId: 2357ad9d-93f6-47fb-9f33-ac3b52e794e1
          cellLabel: evolução mensal das MSRs aguardando match
          config:
            source: |-
              WITH date_dimension AS (
                  SELECT DISTINCT
                      DATE_TRUNC('month', created_at) AS "mês"
                  FROM match.support_request_status_history
              ),
              all_support_requests AS (
                  SELECT
                      support_request_id
                  FROM match.support_requests
              ),
              all_support_requests_all_months AS (
                  SELECT 
                      *
                  FROM all_support_requests
                  CROSS JOIN date_dimension
              ),
              support_request_status_history_with_rn_per_month AS (
                  SELECT 
                      support_request_id,
                      status,
                      created_at,
                      ROW_NUMBER() OVER(PARTITION BY support_request_id, DATE_TRUNC('month', created_at) ORDER BY created_at DESC) AS month_rn
                  FROM match.support_request_status_history
              ),
              support_request_last_status_per_month AS (
                  SELECT
                      support_request_id,
                      status,
                      DATE_TRUNC('month', created_at) AS "mês"
                  FROM support_request_status_history_with_rn_per_month
                  WHERE month_rn = 1
              ),
              support_requests_with_partitions AS (
                  SELECT
                      support_request_id,
                      "mês",
                      status,
                      SUM(CASE WHEN status IS NULL THEN 0 ELSE 1 END) over (ORDER BY support_request_id) AS value_partition
                  FROM all_support_requests_all_months
                  LEFT JOIN support_request_last_status_per_month USING (support_request_id, "mês")
              ),
              support_requests_with_fill_the_gaps AS (
                  SELECT 
                      support_request_id,
                      "mês",
                      COALESCE(status, FIRST_VALUE(status) OVER (PARTITION BY value_partition ORDER BY "mês")) AS status
                  FROM support_requests_with_partitions
              )
              SELECT 
                  "mês",
                  COUNT(DISTINCT CASE WHEN status = 'open' THEN support_request_id ELSE NULL END) AS "aguardando match"
              FROM support_requests_with_fill_the_gaps
              GROUP BY "mês"
            dataFrameCell: false
            dataConnectionId: 683fd824-f935-4980-b99d-a7a513df5030
            resultVariableName: dataframe
