  - cellType: SQL
    cellId: 019d94e3-5d9b-7000-9e49-bb387c993fee # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: "Interrompidos psicológico: total"
    config:
      source: |
        WITH interrompidos_per_year AS (
            SELECT
                DATE_TRUNC('year', created_at) AS ano,
                SUM(
                    CASE WHEN status = 'interrupted_before_support' THEN 1 ELSE 0 END
                ) AS "atendimentos interrompidos por ano",
                SUM(
                    CASE WHEN status = 'interrupted_after_support' THEN 1 ELSE 0 END
                ) AS "encaminhamentos interrompidos por ano"
            FROM match.matches
            WHERE support_type = 'psychological'
            GROUP BY 1
        )

        SELECT
            *,
            SUM("atendimentos interrompidos por ano")
                OVER (ORDER BY ano)
            ::INT AS "total atendimentos interrompidos",
            SUM("encaminhamentos interrompidos por ano")
                OVER (ORDER BY ano)
            ::INT AS "total encaminhamentos interrompidos"
        FROM interrompidos_per_year
        ORDER BY ano
