  - cellType: MARKDOWN
    cellId: 019e69a9-ed2f-7548-8f14-7f37df94e643 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: "## % de MSRs que entra em contato em um determinado tempo após o match criado - último ano"
  - cellType: SQL
    cellId: 019e69ad-1d26-77df-b076-9748182c9dee # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Contact time buckets
    config:
      source: |
        WITH first_contact AS (
            SELECT
                match_id,
                MIN(created_at) AS first_in_contact_at
            FROM mapa.match.match_status_history
            WHERE status = 'in_contact'
            GROUP BY match_id
        ),

        diffs AS (
            SELECT
                m.match_id,
                EXTRACT(EPOCH FROM (fc.first_in_contact_at - m.created_at))
                / 86400.0 AS days_to_contact
            FROM mapa.match.matches AS m
            INNER JOIN first_contact AS fc ON m.match_id = fc.match_id
            WHERE
                m.created_at >= DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year'
                AND m.created_at < DATE_TRUNC('year', CURRENT_DATE)
                AND fc.first_in_contact_at >= m.created_at
                AND fc.first_in_contact_at <= m.created_at + INTERVAL '15 days'
        ),

        bucketed AS (
            SELECT
                CASE
                    WHEN days_to_contact < 5 THEN '0 a 5 dias'
                    WHEN days_to_contact < 10 THEN '5 a 10 dias'
                    ELSE '10 a 15 dias'
                END AS bucket,
                COUNT(*) AS n
            FROM diffs
            GROUP BY 1
        )

        SELECT
            bucket,
            n,
            n::NUMERIC / SUM(n) OVER () AS pct
        FROM bucketed
        ORDER BY
            CASE bucket WHEN '0 a 5 dias' THEN 1 WHEN '5 a 10 dias' THEN 2 ELSE 3 END;
      dataFrameCell: false
      dataConnectionId: 683fd824-f935-4980-b99d-a7a513df5030
      resultVariableName: contact_time_buckets
      useRichDisplay: true
      enablePreview: true
