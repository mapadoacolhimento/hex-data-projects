  - cellType: SQL
    cellId: 019d8818-793c-7337-aab7-38a38ef7bc37 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: "MSRs por tipo: total"
    config:
      source: |
        WITH msr_per_year AS (
            SELECT
                DATE_TRUNC('year', m.created_at) AS ano,
                CASE WHEN sr.support_type = 'psychological' THEN 'psicológico' WHEN sr.support_type = 'legal' THEN 'jurídico' END AS tipo,
                COUNT(DISTINCT m.msr_id) AS "MSRs por ano"
            FROM msr.msrs AS m
            INNER JOIN match.support_requests AS sr ON m.msr_id = sr.msr_id
            GROUP BY 1, 2
        )

        SELECT
            ano,
            tipo,
            "MSRs por ano",
            SUM("MSRs por ano")
                OVER (PARTITION BY tipo ORDER BY ano)
            ::INT AS "total de MSRs"
        FROM msr_per_year
        ORDER BY ano, tipo
      dataFrameCell: false
      dataConnectionId: 683fd824-f935-4980-b99d-a7a513df5030
